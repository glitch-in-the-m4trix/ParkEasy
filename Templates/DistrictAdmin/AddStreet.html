{% extends 'Common/Home.html' %}
{% load widget_tweaks %}
{% block content %}
    <div class="container-fluid">
        {% for error in form.non_field_errors %}
            <span class="message" data-type="error" data-message="{{ error }}"></span>
        {% endfor %}
        {% for message in messages %}
            <span class="message" data-type="{{ message.tags }}" data-message="{{ message }}"></span>
        {% endfor %}
        
        <div class="row d-flex justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header card-header-info">
                        <h4 class="card-title text-center">Add Street</h4>
                    </div>
                    <div class="card-body">
                        <form method="post">
                            {% csrf_token %}
                            <div class="row">
                                <div class="col-md-12">
                                    <div class="form-group">
                                        {{ form.name.label }}
                                        {{ form.name }}
                                    </div>
                                </div>
                            </div>
                            <div class="btn-wrap">
                                <button type="submit" class="btn btn-info pull-right">Add</button>
                            </div>
                            <div class="clearfix"></div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
